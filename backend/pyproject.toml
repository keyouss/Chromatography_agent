[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "chrom-platform-backend"
version = "0.1.0"
description = "Universal chromatography platform API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn==0.49.0",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.50",
  "alembic==1.18.5",
  "redis==8.0.1",
  "rdkit==2026.3.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
worker = ["asyncmy==0.2.14", "dramatiq[redis]==2.2.1", "redis==8.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
